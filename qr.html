<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>باركود الصالون</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#f4f1ea;color:#1b1710;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
h1{font:700 44px/1.1 Amiri,serif;margin:0;text-align:center}
p{margin:0;font-size:22px;text-align:center}
#qr{background:#fff;padding:18px;border-radius:18px;line-height:0;box-shadow:0 4px 18px #0002}
.tools{display:flex;flex-direction:column;gap:10px;width:min(420px,100%)}
input{font:16px system-ui;padding:12px;border:1px solid #bbb;border-radius:10px;direction:ltr;text-align:left}
button{font:700 18px "IBM Plex Sans Arabic",system-ui;padding:14px;border:0;border-radius:12px;background:#c9a24a;color:#1b1710;cursor:pointer}
@media print{.tools{display:none}body{background:#fff;padding-top:40px}}
</style>
</head>
<body>
<h1 id="sn">صالون أبو يوسف</h1>
<p>امسح الباركود وادخل الطابور<br>وشوف كل حلاق معاه كام زبون</p>
<div id="qr"></div>
<div class="tools">
<input id="u" dir="ltr" aria-label="رابط الصفحة">
<button onclick="gen()">تحديث الباركود</button>
<button onclick="window.print()">طباعة</button>
<button onclick="dl()">تحميل صورة PNG</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=i=>document.getElementById(i);
$("u").value=location.origin+"/q";
function gen(){$("qr").innerHTML="";new QRCode($("qr"),{text:$("u").value.trim(),width:320,height:320,correctLevel:QRCode.CorrectLevel.M})}
function dl(){const c=$("qr").querySelector("canvas");if(!c)return;const o=document.createElement("canvas"),p=40;o.width=c.width+p*2;o.height=c.height+p*2;const x=o.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,o.width,o.height);x.drawImage(c,p,p);const a=document.createElement("a");a.download="salon-qr.png";a.href=o.toDataURL("image/png");a.click()}
gen();
</script>
</body>
</html>
