<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>شاشة الصالون</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0B0D12;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
body{display:flex;flex-direction:column}
nav{display:flex;gap:8px;padding:8px;background:#161a22}
nav button{flex:1;font:700 20px "IBM Plex Sans Arabic",system-ui;padding:14px;border:0;border-radius:12px;background:#0f1218;color:#9aa0ab;cursor:pointer}
nav button.on{background:#c9a24a;color:#1b1710}
iframe{flex:1;width:100%;border:0;display:none}
iframe.on{display:block}
</style>
</head>
<body>
<nav><button id="b1" class="on" onclick="sw(1)">تسجيل الزبائن</button><button id="b2" onclick="sw(2)">شاشة الدور</button><button id="b3" onclick="sw(3)">باركود الحيطة</button><button id="b4" onclick="sw(4)">الصنايعية</button></nav>
<iframe id="f1" class="on" src="/kiosk"></iframe>
<iframe id="f2" src="/board"></iframe>
<iframe id="f3" src="/wall"></iframe>
<iframe id="f4" src="/barber"></iframe>
<script>
function sw(n){for(const i of[1,2,3,4]){document.getElementById("f"+i).classList.toggle("on",i==n);document.getElementById("b"+i).classList.toggle("on",i==n)}}
if(location.hash=="#board")sw(2);if(location.hash=="#qr")sw(3);if(location.hash=="#barber")sw(4);
</script>
</body>
</html>
