<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صالون أبو يوسف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F7;--card:#fff;--ink:#15233B;--mute:#6B778A;--red:#D6403A;--blue:#2F5FA8;--brass:#B88A3E;--ok:#2E8B57;--line:#E1E6ED}
@media(prefers-color-scheme:dark){:root{--bg:#0F1826;--card:#18253A;--ink:#EDF1F7;--mute:#93A0B5;--line:#2A3A54}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0)}
.pole{height:8px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
#brand{text-align:center;font-weight:800;font-size:18px;padding:10px 0 0}
#app{max-width:720px;margin:0 auto;padding:0 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:9px 4px;cursor:pointer}nav button.on{color:var(--red);font-weight:800}
h1{font-size:23px;margin:16px 0 8px}h2{font-size:16px;margin:18px 0 8px}
.box,.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m{color:var(--mute);font-size:13px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:4px 11px;font-size:13px}.btn.w{width:100%}.btn:disabled{opacity:.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;cursor:pointer}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-bottom:8px}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--line)}.tag.ok{background:var(--ok);color:#fff}.tag.rd{background:var(--red);color:#fff}
.tk{background:var(--card);border:2px dashed var(--brass);border-radius:14px;text-align:center;padding:14px;margin-bottom:10px}
.tk .no{font-size:64px;font-weight:800;line-height:1;color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--brass)}
.stars button{background:none;border:0;font-size:30px;color:var(--line);cursor:pointer;padding:0 2px}.stars button.on{color:var(--brass)}
.tot{display:flex;justify-content:space-between}.tot.f{font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:9;max-width:90%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue)}
</style>
</head>
<body>
<div class="pole"></div><div id="brand">💈</div><div id="app"></div><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const C={cfg:{salon_name:"صالون أبو يوسف",currency:"ج.م",days_ahead:5,max_discount_pct:20}};
const fm=n=>Math.round(n).toLocaleString("ar-EG")+" "+C.cfg.currency;
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
const PER={morning:"صباحًا (6–12)",afternoon:"ظهرًا (12–5)",evening:"مساءً (5–12)",night:"سهرة (12–6)"};
const ST={upcoming:"قادم",checked_in:"وصل",in_service:"على الكرسي",done:"خلص",cancelled:"ملغي"};
const LR={purchase:"فاتورة",welcome:"هدية التسجيل",review:"تقييم",visit:"مكافأة زيارات",redeem:"استبدال مكافأة"};
const ACTIVE=["upcoming","checked_in","in_service"];
const PD={cashier:{use_attendance:1,use_pos:1,manage_appts:1},barber:{view_own_schedule:1,use_attendance:1}};
const can=k=>me.role=="owner"||(me.perms&&k in me.perms?!!me.perms[k]:!!(PD[me.role]||{})[k]);
let me,cu,tab,tabs,timer;const V={};
const put=h=>$("app").innerHTML=h;
const Q=p=>Promise.resolve(p).then(r=>{if(r.error)throw r.error;return r.data});
const R=(n,a)=>Q(sb.rpc(n,a||{}));
const run=async f=>{try{await f()}catch(e){toast(e.message||"حصل خطأ، جرّب تاني")}};
const dstr=i=>new Date(Date.now()+i*864e5).toLocaleDateString("sv");
const dlabel=i=>i==0?"النهارده":i==1?"بكرة":new Date(Date.now()+i*864e5).toLocaleDateString("ar-EG",{weekday:"long",day:"numeric"});

/* ===== الدخول ===== */
async function boot(){
  const{data:s}=await sb.from("app_settings").select("*");(s||[]).forEach(r=>C.cfg[r.key]=r.value);
  document.title=C.cfg.salon_name;$("brand").textContent="💈 "+C.cfg.salon_name;
  const{data:{session}}=await sb.auth.getSession();if(!session)return authView();
  const{data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  me=p||{role:"customer",full_name:session.user.email,id:session.user.id};
  if(["owner","cashier","barber"].includes(me.role)){
    const T=[];
    if(can("use_pos"))T.push(["pos","الكاشير"]);
    if(me.role=="barber"||me.role=="owner")T.push(["q","الدور"]);
    if(can("use_attendance"))T.push(["att","حضوري"]);
    tabs=[...T,["out","خروج"]];return go(T[0]?T[0][0]:"none");
  }
  cu=await Q(sb.from("customers").select("*").eq("user_id",me.id).maybeSingle());
  if(!cu)return regView();
  tabs=[["book","احجز"],["mine","حجوزاتي"],["loy","نقاطي"],["out","خروج"]];go("book");
}
function go(t){
  clearInterval(timer);
  if(t=="out"){sb.auth.signOut().then(()=>{$("nav").innerHTML="";authView()});return}
  tab=t;$("nav").innerHTML=tabs.map(x=>`<button class="${x[0]==t?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");
  run(()=>V[t]());
}
function live(t,f){timer=setInterval(()=>{if(tab==t&&!document.hidden)run(f)},15000)}
function authView(){put(`<h1>أهلاً بيك في ${esc(C.cfg.salon_name)}</h1><div class="box"><input id="nm" placeholder="الاسم (للتسجيل الجديد فقط)"><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة السر (6 حروف على الأقل)"><div class="chips"><button class="btn" onclick="login()">دخول</button><button class="btn g" onclick="signup()">حساب جديد</button></div></div>`)}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});error?toast("البريد أو كلمة السر غلط"):boot()}
async function signup(){const{data,error}=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value,options:{data:{full_name:$("nm").value}}});if(error)return toast(error.message);data.session?boot():toast("افتح الرابط اللي وصلك على الإيميل وبعدين ادخل")}
function regView(msg){put(`<h1>كمّل بياناتك</h1><div class="box">${msg?`<p>${msg}</p><button class="btn w" onclick="boot()">حدّث الحالة</button>`:`<input id="rn" placeholder="الاسم" value="${esc(me.full_name)}"><input id="rp" type="tel" inputmode="numeric" placeholder="رقم الموبايل (01xxxxxxxxx)"><button class="btn w" onclick="doReg()">سجّل وخد هدية التسجيل</button>`}</div>`)}
function doReg(){run(async()=>{const id=await R("register_customer",{p_name:$("rn").value.trim(),p_phone:$("rp").value});
  if(id===0)regView("الرقم ده متسجل عندنا قبل كده. اطلب من الكاشير يأكد إنه رقمك، وبعدين اضغط \"حدّث الحالة\".");else boot()})}

/* ===== العميل: الحجز بالدور ===== */
const B={day:dstr(0),per:"morning",bar:null,sv:new Set(),svc:null,bl:[]};
V.book=async()=>{if(!B.svc)B.svc=await Q(sb.from("services").select("*").eq("active",true).order("category"));await loadBars();drawBook()};
async function loadBars(){B.bl=await R("available_barbers",{p_day:B.day,p_period:B.per}).catch(e=>{toast(e.message);return[]})}
async function pickB(k,v){B[k]=v;if(k!="bar"){B.bar=null;await loadBars()}drawBook()}
function tgS(id){B.sv.has(id)?B.sv.delete(id):B.sv.add(id);drawBook()}
function drawBook(){
  const n=+C.cfg.days_ahead||5,cats=[...new Set(B.svc.map(s=>s.category||"خدمات"))];
  const tot=B.svc.filter(s=>B.sv.has(s.id)).reduce((a,s)=>a+ +s.price,0);
  put(`<h1>احجز دورك</h1>
  <h2>اليوم</h2><div class="chips">${Array.from({length:n},(_,i)=>`<button class="chip ${B.day==dstr(i)?"sel":""}" onclick="pickB('day','${dstr(i)}')">${dlabel(i)}</button>`).join("")}</div>
  <h2>الفترة</h2><div class="chips">${Object.entries(PER).map(([k,v])=>`<button class="chip ${B.per==k?"sel":""}" onclick="pickB('per','${k}')">${v}</button>`).join("")}</div>
  <h2>الحلاق</h2>${B.bl.length?`<div class="chips"><button class="chip ${B.bar===null?"sel":""}" onclick="pickB('bar',null)">الأقل انتظارًا</button>${B.bl.map(b=>`<button class="chip ${B.bar==b.id?"sel":""}" onclick="pickB('bar','${b.id}')">${esc(b.full_name)} <span class="m">(${b.waiting} منتظر · ~${b.est_min} د)</span></button>`).join("")}</div>`:`<div class="box m">مفيش حلاق متاح في الفترة دي، جرّب فترة أو يوم تاني.</div>`}
  <h2>الخدمات</h2>${cats.map(c=>`<div class="m">${esc(c)}</div><div class="chips">${B.svc.filter(s=>(s.category||"خدمات")==c).map(s=>`<button class="chip ${B.sv.has(s.id)?"sel":""}" onclick="tgS(${s.id})">${esc(s.name)} · ${fm(s.price)}</button>`).join("")}</div>`).join("")}
  <div class="box"><div class="tot f"><span>الإجمالي</span><b>${fm(tot)}</b></div></div>
  <button class="btn w" ${B.sv.size&&B.bl.length?"":"disabled"} onclick="confirmBook()">احجز الدور</button>`);
}
function confirmBook(){run(async()=>{await R("book_ticket",{p_barber:B.bar,p_day:B.day,p_period:B.per,p_services:[...B.sv]});B.sv.clear();toast("اتحجز دورك ✓");go("mine")})}

/* ===== العميل: حجوزاتي + التقييم ===== */
V.mine=async()=>{
  const h=await R("my_history"),act=h.filter(x=>ACTIVE.includes(x.status));
  const qs=await Promise.all(act.map(x=>R("queue_status",{p_id:x.id}).then(r=>r[0])));
  const old=h.filter(x=>!ACTIVE.includes(x.status));
  put(`<h1>حجوزاتي</h1>${qs.length?qs.map(q=>{
    const st=q.status=="in_service"?`<b>إنت على الكرسي دلوقتي</b>`:q.called?`<b style="color:var(--red)">اتنادى عليك! تعالى دلوقتي</b><div class="chips" style="justify-content:center;margin-top:8px"><button class="chip ${q.eta=="on_way"?"sel":""}" onclick="eta(${q.id},'on_way')">في الطريق</button><button class="chip ${q.eta=="arrived"?"sel":""}" onclick="eta(${q.id},'arrived')">وصلت</button></div>`
      :`قدامك <b>${q.ahead}</b> · تقريبًا <b>${q.est_min}</b> دقيقة`;
    return `<div class="tk"><div class="m">${q.day} · ${PER[q.period]} · ${esc(q.barber_name||"")}</div><div class="no">${q.ticket_no}</div><div class="m">الحالي عند الحلاق: ${q.current_no??"لسه ما بدأ"}</div><div style="margin:8px 0">${st}</div><div class="m">${esc(q.services)} · ${fm(q.total)}</div>${!q.called&&q.status=="upcoming"?`<button class="btn g s" style="margin-top:8px" onclick="cancelA(${q.id})">إلغاء الحجز</button>`:""}</div>`}).join(""):`<div class="box m">مفيش حجز نشط. اضغط "احجز" وخد دورك.</div>`}
  <h2>الحجوزات اللي فاتت</h2>${old.map(x=>`<div class="row"><div><b>#${x.ticket_no??""}</b> ${x.day} · ${esc(x.barber_name||"")}<div class="m">${esc(x.services)}</div></div><div style="text-align:left"><span class="tag ${x.status=="done"?"ok":""}">${ST[x.status]}</span>${x.paid?`<div class="m">${fm(x.paid)}${x.points?` · +${x.points} نقطة`:""}</div>`:""}${x.status=="done"&&!x.rated?`<button class="btn s" onclick="rateView(${x.id})">قيّم (+${C.cfg.review_bonus||20} نقطة)</button>`:""}</div></div>`).join("")||`<div class="m">لسه مفيش.</div>`}`);
  if(qs.length)live("mine",V.mine);
};
const eta=(id,s)=>run(async()=>{await R("ticket_eta",{p_id:id,p_state:s});V.mine()});
const cancelA=id=>{if(confirm("تلغي الحجز؟"))run(async()=>{await R("cancel_my_appt",{p_id:id});V.mine()})};
const RT={id:0,b:0,s:0,p:0,tags:new Set,note:""};
const TAGS=["شغل نضيف","سريع","محترم","المكان نضيف","ملتزم بالدور"];
function rateView(id){clearInterval(timer);if(id){Object.assign(RT,{id,b:0,s:0,p:0,tags:new Set,note:""})}
  const st=(k,l)=>`<div class="row"><span>${l}</span><span class="stars">${[1,2,3,4,5].map(i=>`<button class="${RT[k]>=i?"on":""}" onclick="RT.${k}=${i};rateView()" aria-label="${i}">★</button>`).join("")}</span></div>`;
  put(`<h1>قيّم زيارتك</h1>${st("b","الحلاق")}${st("s","الخدمة")}${st("p","المكان")}<div class="chips">${TAGS.map(t=>`<button class="chip ${RT.tags.has(t)?"sel":""}" onclick="RT.note=$('rn').value;RT.tags.has('${t}')?RT.tags.delete('${t}'):RT.tags.add('${t}');rateView()">${t}</button>`).join("")}</div><textarea id="rn" rows="3" placeholder="ملاحظة (اختياري)">${esc(RT.note)}</textarea><button class="btn w" ${RT.b&&RT.s&&RT.p?"":"disabled"} onclick="sendRate()">ابعت التقييم</button> <button class="btn g w" style="margin-top:8px" onclick="go('mine')">لاحقًا</button>`)}
const sendRate=()=>run(async()=>{await R("rate_ticket",{p_appt:RT.id,p_barber:RT.b,p_service:RT.s,p_place:RT.p,p_tags:[...RT.tags],p_note:$("rn").value});toast("شكرًا! اتضافت نقاط التقييم ✓");go("mine")});

/* ===== العميل: النقاط والمكافآت ===== */
V.loy=async()=>{
  const[c,rw,rd,lg]=await Promise.all([Q(sb.from("customers").select("*").eq("id",cu.id).single()),Q(sb.from("loyalty_rewards").select("*").eq("active",true).order("cost")),
    Q(sb.from("loyalty_redemptions").select("*,loyalty_rewards(name)").eq("customer_id",cu.id).eq("status","active")),Q(sb.from("loyalty_ledger").select("*").eq("customer_id",cu.id).order("id",{ascending:false}).limit(15))]);
  const t=(await R("loyalty_tier",{p_life:c.lifetime_points}))[0];
  put(`<h1>نقاطي</h1><div class="box"><div class="row" style="border:0;padding:0;margin:0"><div><div class="m">رصيدك</div><b style="font-size:34px">${c.points}</b> نقطة</div><span class="tag rd">${t.name} · ×${t.mult}</span></div>
  <div class="bar"><i style="width:${t.next_at?Math.min(100,c.lifetime_points/t.next_at*100):100}%"></i></div><div class="m">${t.next_at?`باقي ${t.next_at-c.lifetime_points} نقطة للمستوى الجاي`:"وصلت لأعلى مستوى 👑"} · زياراتك: ${c.visits}</div></div>
  ${rd.length?`<h2>كوبوناتك (اديها للكاشير)</h2>${rd.map(r=>`<div class="row"><span>${esc(r.loyalty_rewards.name)}</span><b style="letter-spacing:2px">${r.code}</b></div>`).join("")}`:""}
  <h2>استبدل نقاطك</h2>${rw.map(r=>`<div class="row"><div>${esc(r.name)}<div class="m">${r.cost} نقطة</div></div><button class="btn s" ${c.points<r.cost?"disabled":""} onclick="redeem(${r.id})">استبدل</button></div>`).join("")}
  <h2>آخر الحركات</h2>${lg.map(l=>`<div class="row"><span>${LR[l.reason]||l.reason}${l.note?` <span class="m">${esc(l.note)}</span>`:""}</span><b style="color:${l.points>0?"var(--ok)":"var(--red)"}">${l.points>0?"+":""}${l.points}</b></div>`).join("")||`<div class="m">لسه مفيش حركات.</div>`}`);
};
const redeem=id=>run(async()=>{const code=await R("redeem_reward",{p_reward:id});toast("كودك: "+code);V.loy()});

/* ===== الحلاق / المالك: شاشة الدور ===== */
const QS={bl:null,b:null};
V.q=async()=>{
  let bid=me.id,pick="";
  if(me.role!="barber"){QS.bl=QS.bl||await R("list_barbers");bid=QS.b=QS.b||QS.bl[0]?.id;
    pick=`<div class="chips">${QS.bl.map(b=>`<button class="chip ${b.id==bid?"sel":""}" onclick="QS.b='${b.id}';V.q()">${esc(b.full_name)}</button>`).join("")}</div>`}
  const rows=bid?await R("staff_schedule",{p_staff:bid}):[];let last="";
  put(`<h1>الدور</h1>${pick}${rows.map(r=>{const g=r.day+" · "+PER[r.period],h=g!=last?`<h2>${last=g}</h2>`:"";
    return h+`<div class="row"><div><b style="font-size:20px;color:var(--red)">${r.ticket_no}</b> ${esc(r.customer_name)} <span class="tag ${r.status=="in_service"?"ok":""}">${ST[r.status]}</span>${r.eta?` <span class="tag">${r.eta=="arrived"?"وصل":"في الطريق"}</span>`:""}<div class="m">${esc(r.services)} · ${fm(r.total)}${r.customer_phone?` · <a href="tel:${esc(r.customer_phone)}">${esc(r.customer_phone)}</a>`:""}</div></div>
    <div class="chips" style="margin:0">${!r.called&&r.status!="in_service"?`<button class="btn s" onclick="qa('call_ticket',${r.id})">نادِ</button>`:""}${r.status!="in_service"?`<button class="btn s g" onclick="qs(${r.id},'in_service')">ابدأ</button>`:`<button class="btn s g" onclick="qa('finish_ticket',${r.id})">خلّص</button>`}${r.status=="in_service"&&can("use_pos")?`<button class="btn s" onclick="payAppt(${r.id})">حاسب</button>`:""}</div></div>`}).join("")||`<div class="box m">مفيش زباين في الدور.</div>`}`);
  live("q",V.q);
};
const qa=(f,id)=>run(async()=>{await R(f,{p_id:id});V.q()});
const qs=(id,s)=>run(async()=>{await R("set_my_appt_status",{p_id:id,p_status:s});V.q()});

/* ===== الكاشير ===== */
const P={cid:"",bid:"",appt:null,it:{},disc:0,pay:"cash",cp:"",q:"",D:null,cps:[]};
V.pos=async()=>{
  if(!P.D){const[sv,pr,cs,bl]=await Promise.all([Q(sb.from("services").select("*").eq("active",true)),Q(sb.from("products").select("*").eq("active",true)),Q(sb.from("customers").select("id,name,phone").order("name")),R("list_barbers")]);P.D={sv,pr,cs,bl}}
  P.cl=await Q(sb.from("claim_requests").select("*,customers(name,phone)"));drawPos();
};
async function loadCps(){P.cp="";P.cps=P.cid?await Q(sb.from("loyalty_redemptions").select("id,code,loyalty_rewards(name)").eq("customer_id",P.cid).eq("status","active")):[]}
function pk(k,id,n){const key=k+":"+id;P.it[key]=(P.it[key]||0)+n;if(P.it[key]<=0)delete P.it[key];drawPos()}
function drawPos(){
  const{sv,pr,cs,bl}=P.D,q=P.q.trim(),cl=cs.filter(c=>!q||(c.name+c.phone).includes(q)).slice(0,30);
  const ln=Object.entries(P.it).map(([k,n])=>{const[t,id]=k.split(":"),o=(t=="service"?sv:pr).find(x=>x.id==id);return{k,t,id:+id,n,name:o.name,p:+o.price}});
  const sub=ln.reduce((a,l)=>a+l.p*l.n,0);
  put(`<h1>الكاشير</h1>${P.cl.length?`<div class="box"><b>طلبات ربط رقم</b>${P.cl.map(r=>`<div class="row" style="margin:6px 0 0"><span>${esc(r.customers.name)} <span class="m">${esc(r.customers.phone)}</span></span><span class="chips" style="margin:0"><button class="btn s" onclick="claim('approve_claim',${r.id})">أكّد</button><button class="btn s g" onclick="claim('reject_claim',${r.id})">ارفض</button></span></div>`).join("")}</div>`:""}
  ${P.appt?`<div class="box">فاتورة حجز رقم ${P.appt} <button class="btn s g" onclick="P.appt=null;P.it={};drawPos()">إلغاء الربط</button></div>`:""}
  <input placeholder="دوّر على عميل بالاسم أو الموبايل" value="${esc(P.q)}" oninput="P.q=this.value;drawPos();document.querySelector('input').focus()">
  <select onchange="P.cid=this.value;loadCps().then(drawPos)"><option value="">زبون بدون تسجيل</option>${cl.map(c=>`<option value="${c.id}" ${c.id==P.cid?"selected":""}>${esc(c.name)} — ${esc(c.phone||"")}</option>`).join("")}</select>
  <select onchange="P.bid=this.value"><option value="">الحلاق</option>${bl.map(b=>`<option value="${b.id}" ${b.id==P.bid?"selected":""}>${esc(b.full_name)}</option>`).join("")}</select>
  <h2>خدمات</h2><div class="chips">${sv.map(s=>`<button class="chip ${P.it["service:"+s.id]?"sel":""}" onclick="pk('service',${s.id},${P.it["service:"+s.id]?-1:1})">${esc(s.name)} · ${fm(s.price)}</button>`).join("")}</div>
  <h2>منتجات</h2><div class="chips">${pr.map(s=>`<button class="chip" onclick="pk('product',${s.id},1)">${esc(s.name)} · ${fm(s.price)}</button>`).join("")}</div>
  <div class="box">${ln.map(l=>`<div class="tot"><span>${esc(l.name)} ×${l.n} <button class="btn s g" onclick="pk('${l.t}',${l.id},-1)" aria-label="شيل">−</button></span><span>${fm(l.p*l.n)}</span></div>`).join("")||`<span class="m">لسه مفيش أصناف</span>`}
  <div class="tot f"><span>الإجمالي</span><span>${fm(sub*(1-P.disc/100))}</span></div></div>
  ${P.cps.length?`<select onchange="P.cp=this.value"><option value="">كوبون ولاء (اختياري)</option>${P.cps.map(c=>`<option value="${c.id}" ${c.id==P.cp?"selected":""}>${esc(c.loyalty_rewards.name)} — ${c.code}</option>`).join("")}</select>`:""}
  <input type="number" min="0" max="${me.role=="owner"?100:C.cfg.max_discount_pct}" placeholder="خصم %" value="${P.disc||""}" onchange="P.disc=+this.value||0;drawPos()">
  <div class="chips">${[["cash","نقدي"],["card","كارت"],["wallet","محفظة"]].map(x=>`<button class="chip ${P.pay==x[0]?"sel":""}" onclick="P.pay='${x[0]}';drawPos()">${x[1]}</button>`).join("")}</div>
  <button class="btn w" ${ln.length?"":"disabled"} onclick="checkout()">تم الدفع</button>`);
}
const claim=(f,id)=>run(async()=>{await R(f,{p_id:id});V.pos()});
const checkout=()=>run(async()=>{
  const items=Object.entries(P.it).map(([k,n])=>{const[t,id]=k.split(":");return{type:t,id:+id,qty:t=="service"?1:n}});
  const inv=await R("checkout_invoice",{p_customer:P.cid?+P.cid:null,p_barber:P.bid||null,p_items:items,p_discount_pct:P.disc,p_method:P.pay,p_appointment:P.appt,p_redemption:P.cp?+P.cp:null});
  Object.assign(P,{cid:"",bid:"",appt:null,it:{},disc:0,cp:"",cps:[],q:""});toast("اتسجلت الفاتورة #"+inv+" ✓");V.pos()});
const payAppt=id=>run(async()=>{
  const[a,s]=await Promise.all([Q(sb.from("appointments").select("customer_id,barber_id").eq("id",id).single()),Q(sb.from("appointment_services").select("service_id").eq("appointment_id",id))]);
  P.D=null;Object.assign(P,{appt:id,cid:String(a.customer_id),bid:a.barber_id||"",it:Object.fromEntries(s.map(x=>["service:"+x.service_id,1])),disc:0,cp:"",q:""});
  await loadCps();tabs.some(t=>t[0]=="pos")&&go("pos")});

/* ===== الحضور بالموقع ===== */
V.att=async()=>{
  const[a]=await Q(sb.from("attendance").select("*").eq("staff_id",me.id).order("id",{ascending:false}).limit(1));const inn=a&&!a.check_out;
  put(`<h1>حضوري</h1><div class="box">${inn?`<b>حاضر من ${new Date(a.check_in).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}</b>${a.late_min?`<div class="m">متأخر ${a.late_min} دقيقة</div>`:""}`:`<span class="m">مش مسجل حضور دلوقتي</span>`}</div>
  <button class="btn w" onclick="geo('${inn?"check_out":"check_in"}')">${inn?"سجّل انصراف":"سجّل حضور"}</button><p class="m">لازم تفعّل الموقع (GPS) وتكون جوه الصالون.</p>`);
};
function geo(fn){const go_=(a)=>run(async()=>{toast(await R(fn,a));V.att()});
  if(!navigator.geolocation)return go_({});
  navigator.geolocation.getCurrentPosition(p=>go_({p_lat:p.coords.latitude,p_lng:p.coords.longitude}),()=>go_({}),{enableHighAccuracy:true,timeout:10000})}

V.none=()=>put(`<h1>مفيش صلاحيات</h1><div class="box m">حسابك لسه ما اتحددش له صلاحيات. كلّم المالك.</div>`);
boot();
</script>
</body>
</html>
