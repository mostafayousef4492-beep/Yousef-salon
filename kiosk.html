<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="robots" content="noindex">
<title>شاشة الصالون</title>
<link rel="manifest" href="/manifest-kiosk.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شاشة الصالون">
<link rel="icon" type="image/png" href="/icon-kiosk-192.png">
<link rel="apple-touch-icon" href="/icon-kiosk-180.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/ui/theme.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 36px;border-bottom:1px solid var(--line2)}
h1{font:700 40px/1 Amiri,serif;margin:0;color:var(--gold2)}
#clock{font-size:28px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
main{flex:1;padding:28px 36px;overflow:auto}
.lbl{color:var(--mute);font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.bc{background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:26px;text-align:center;box-shadow:var(--shadow)}
.bc .n{font-size:30px;font-weight:700}
.bc .w{font-size:84px;font-weight:700;line-height:1.1;color:var(--gold2);margin:10px 0 2px;font-variant-numeric:tabular-nums}
.bc .u{color:var(--mute);font-size:20px}
.bc .e{margin-top:14px;font-size:22px;font-weight:600}
.bc.free .w{color:#4ade80;font-size:56px;padding:14px 0}
.empty{text-align:center;color:var(--mute);font-size:26px;padding:80px 0}
footer{padding:20px 36px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2);display:flex;gap:16px;align-items:center}
.book{flex:1;display:block;text-align:center;text-decoration:none;background:var(--gold);color:#1B1710;font-size:30px;font-weight:700;padding:22px;border-radius:20px}
#stat{font-size:16px;color:var(--mute);min-width:110px;text-align:center}
#stat.bad{color:#f87171}
</style>
</head>
<body>
<header><h1 id="sn">صالون أبو يوسف</h1><div id="clock"></div></header>
<main><p class="lbl">الحلاقين المتاحين دلوقتي — اختار الأقل زحمة</p><div id="list" class="grid"></div></main>
<footer><a class="book" href="/book">احجز دورك الآن</a><a class="book" style="flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line2);font-size:22px;padding:22px 26px" href="/kiosk-att">حضور الموظفين</a><div id="stat">…</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>Number(n||0).toLocaleString("ar-EG");
// نفس تقسيم الفترات في صفحة الحجز
const period=()=>{const h=new Date().getHours();return h>=6&&h<12?"morning":h>=12&&h<17?"afternoon":h>=17?"evening":"night"};
const today=()=>new Date().toLocaleDateString("en-CA");
function tick(){$("clock").textContent=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}
async function load(){
  try{
    const{data,error}=await sb.rpc("available_barbers",{p_day:today(),p_period:period()});
    if(error)throw error;
    const L=(data||[]).slice().sort((a,b)=>(a.waiting||0)-(b.waiting||0));
    $("list").innerHTML=L.length?L.map(x=>x.waiting?`<div class="bc"><div class="n">${esc(x.full_name)}</div><div class="w">${nf(x.waiting)}</div><div class="u">في الدور قدامك</div><div class="e">حوالي ${nf(x.est_min)} دقيقة</div></div>`:`<div class="bc free"><div class="n">${esc(x.full_name)}</div><div class="w">متاح</div><div class="u">مفيش انتظار</div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">مفيش حلاق متاح في الفترة دي</div>`;
    $("stat").textContent="تحديث تلقائي ✓";$("stat").className="";
  }catch(e){$("stat").textContent="مفيش اتصال";$("stat").className="bad"}
}
(async()=>{try{const{data}=await sb.from("app_settings").select("*").eq("key","salon_name");if(data&&data[0])$("sn").textContent=data[0].value}catch(e){}})();
tick();setInterval(tick,15000);load();setInterval(load,10000);
document.addEventListener("contextmenu",e=>e.preventDefault());
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
</body>
</html>
