<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="robots" content="noindex">
<title>ادخل الطابور</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("salon_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/src/ui/base.css">
<link rel="stylesheet" href="/src/ui/theme.css">
<style>#app{padding-bottom:40px}.foot{text-align:center;margin-top:22px}.row.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}</style>
</head>
<body>
<header class="top"><div class="pole"></div><div id="brand"><span id="bn">صالون أبو يوسف</span></div></header>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/src/ui/theme-lite.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const dig=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
const period=()=>{const h=new Date().getHours();return h>=6&&h<12?"morning":h>=12&&h<17?"afternoon":h>=17?"evening":"night"};
const C={name:"",phone:"",barber:null,L:[],busy:false,dp:null};
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();C.dp=e;inst()});
function inst(){const b=$("inst");if(!b||standalone())return;
  b.innerHTML=C.dp?`<button class="btn g" style="width:100%" onclick="doInstall()">نزّل تطبيق الصالون (النقاط والعروض)</button>`:(ios?`<p class="m" style="text-align:center">لتنزيل التطبيق: زرار المشاركة ← «إضافة إلى الشاشة الرئيسية»</p>`:"")}
async function doInstall(){if(!C.dp)return;C.dp.prompt();await C.dp.userChoice;C.dp=null;inst()}

async function init(){
  const{data}=await sb.from("app_settings").select("*");const cfg={};(data||[]).forEach(r=>cfg[r.key]=r.value);
  if(cfg.salon_name){$("bn").textContent=cfg.salon_name;document.title="ادخل الطابور - "+cfg.salon_name}
  const L=store.get("salon_book_last");
  if(L){const{data:t}=await sb.rpc("public_ticket",{p_id:L.id,p_phone:L.p});const s=t&&t[0];
    if(s&&["upcoming","checked_in","in_service"].includes(s.status))return location.replace("/book");store.del("salon_book_last")}
  if(cfg.booking_open===false||cfg.booking_open==="false")return $("app").innerHTML=`<h1>ادخل الطابور</h1><div class="box"><p class="m">الحجز متوقف حاليًا، كلّم الكاشير.</p></div>`;
  const i=store.get("salon_book_info");if(i){C.name=i.n||"";C.phone=i.p||""}
  $("app").innerHTML=`<h1>ادخل الطابور</h1><p class="m" style="margin:0 0 4px">اكتب اسمك ورقمك وخد دورك فورًا — من غير تسجيل.</p>
<h2>الحلاقين دلوقتي</h2><div id="bl"><p class="m">جاري التحميل...</p></div>
<h2>بياناتك</h2><div class="box"><input id="fn" placeholder="اسمك" value="${esc(C.name)}" autocomplete="name" oninput="C.name=this.value"><input id="fp" type="tel" inputmode="numeric" placeholder="رقم موبايلك (01xxxxxxxxx)" value="${esc(C.phone)}" autocomplete="tel" oninput="C.phone=this.value"><button class="btn" id="go" style="width:100%" onclick="join()" disabled>ادخل الطابور</button></div>
<div class="foot" id="inst"></div>`;
  inst();loadB();setInterval(loadB,10000)}

async function loadB(){
  const d=new Date().toLocaleDateString("en-CA");
  const{data,error}=await sb.rpc("available_barbers",{p_day:d,p_period:period()});
  if(error){$("bl").innerHTML=`<p class="m">مقدرناش نحمّل الحلاقين، جرّب تاني.</p>`;return}
  C.L=(data||[]).slice().sort((a,b)=>(a.waiting||0)-(b.waiting||0));
  if(C.barber&&!C.L.some(x=>x.id==C.barber))C.barber=null;
  const nf=n=>Number(n||0).toLocaleString("ar-EG");
  $("bl").innerHTML=C.L.length?`<button class="row ${C.barber?"":"sel"}" style="cursor:pointer;width:100%" onclick="C.barber=null;loadB()"><b>أي حلاق (الأقل زحمة)</b><span class="m">أسرع دور</span></button>`+C.L.map(x=>`<button class="row ${C.barber==x.id?"sel":""}" style="cursor:pointer;width:100%" onclick="C.barber='${x.id}';loadB()"><b>${esc(x.full_name)}</b><span class="m">${x.waiting?nf(x.waiting)+" قدامك · ~"+nf(x.est_min)+" د":"متاح دلوقتي"}</span></button>`).join(""):`<div class="box"><p class="m">مفيش حلاق متاح دلوقتي، كلّم الكاشير.</p></div>`;
  $("go").disabled=!C.L.length||C.busy}

async function join(){if(C.busy)return;const n=(C.name||"").trim(),ph=dig(C.phone);
  if(n.length<2)return toast("اكتب اسمك");if(!/^01\d{9}$/.test(ph))return toast("الموبايل لازم 11 رقم ويبدأ بـ 01");
  C.busy=true;$("go").disabled=true;
  const r=await sb.rpc("public_book_v2",{p_name:n,p_phone:ph,p_barber:C.barber||null,p_day:new Date().toLocaleDateString("en-CA"),p_period:period(),p_services:[]});
  C.busy=false;const t=!r.error&&r.data&&r.data.ticket;
  if(!t){$("go").disabled=false;return toast(!r.error?"الحجز لم يتأكد، جرّب تاني":(!r.error.code&&!r.error.hint?"النت واقف — جرّب تاني (مش هيتكرر)":(r.error.message||"الحجز لم يتأكد")))}
  store.set("salon_book_info",{n,p:ph});store.set("salon_book_last",{id:t.id,p:ph});location.href="/book"}
init();
</script>
</body>
</html>
